name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  contents: write
  issues: write

jobs:
  convert-to-draft:
    name: Convert PR to Draft
    runs-on: [self-hosted, Linux, X64]

    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false

    permissions:
      pull-requests: write
      contents: write
      issues: write

    steps:
      - name: Move Pull Request to Draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr ready "$PR_URL" --undo
